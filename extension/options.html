<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки — Китайский тренажёр</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; color: #241f1a; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 14px; border: none; border-radius: 6px; background: #b52825; color: #fff; cursor: pointer; }
    p.hint { font-size: 12px; color: #6b6354; }
    #saved { font-size: 12px; color: #4f8067; margin-left: 8px; }
  </style>
</head>
<body>
  <h2>墨 Китайский тренажёр</h2>
  <label for="url">Адрес приложения (там, где оно открыто — localhost при разработке, либо адрес вашего хостинга)</label>
  <input id="url" type="text" placeholder="http://localhost:5173/" />
  <button id="save">Сохранить</button>
  <span id="saved"></span>
  <p class="hint">Расширение открывает этот адрес с добавленным <code>#add=слово</code> — приложение сразу подставит слово в переводчик на вкладке «Добавить».</p>
  <script src="options.js"></script>
</body>
</html>
