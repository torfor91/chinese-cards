<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Cards — изучение китайского</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <h1>Chinese Cards</h1>
    <nav class="nav">
      <button class="nav-btn active" data-tab="study">Учёба</button>
      <button class="nav-btn" data-tab="cards">Карточки</button>
      <button class="nav-btn" data-tab="stats">Статистика</button>
    </nav>
  </header>

  <main class="main">
    <!-- Экран учёбы -->
    <section id="tab-study" class="tab active">
      <div id="session-empty" class="empty-state">
        <p>Нажмите «Начать сессию», чтобы повторить карточки.</p>
        <button id="start-session" class="btn primary">Начать сессию</button>
      </div>

      <div id="card-view" class="card-view hidden">
        <div class="card-counter">
          Карточка <span id="card-current">1</span> из <span id="card-total">0</span>
        </div>
        <div class="flashcard">
          <div class="flashcard-hieroglyph" id="card-hieroglyph">—</div>
          <div class="flashcard-pinyin" id="card-pinyin"></div>
          <div class="flashcard-translation hidden" id="card-translation"></div>
          <button id="show-answer" class="btn">Показать перевод</button>
        </div>
        <div class="answer-buttons hidden" id="answer-buttons">
          <button class="btn danger" data-quality="1">Не знаю</button>
          <button class="btn warning" data-quality="3">Сложно</button>
          <button class="btn success" data-quality="5">Легко</button>
        </div>
      </div>
    </section>

    <!-- Экран карточек -->
    <section id="tab-cards" class="tab">
      <h2>Добавить карточку</h2>
      <form id="card-form" class="form">
        <input type="text" id="input-hieroglyph" placeholder="Иероглиф" required>
        <input type="text" id="input-pinyin" placeholder="Пиньинь">
        <input type="text" id="input-translation" placeholder="Перевод" required>
        <input type="number" id="input-tone" placeholder="Тон (0–4)" min="0" max="4" required>
        <button type="submit" class="btn primary">Добавить</button>
      </form>
      <div id="form-error" class="error hidden"></div>

      <h2>Список карточек (<span id="cards-count">0</span>)</h2>
      <div id="cards-list" class="cards-list"></div>
    </section>

    <!-- Экран статистики -->
    <section id="tab-stats" class="tab">
      <h2>Прогресс</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Всего</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-learned">0</div>
          <div class="stat-label">Выучено</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-progress">0</div>
          <div class="stat-label">В процессе</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-fresh">0</div>
          <div class="stat-label">Новых</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p id="progress-percent">0% выучено</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
